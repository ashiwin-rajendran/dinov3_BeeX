run_name: fls_grayscale_probe
description: Single-channel FLS grayscale distillation probe.

paths:
  image_dir: /path/to/fls_images
  weights: /path/to/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
  dinov3_repo: /path/to/dinov3
  checkpoint_dir: checkpoints_fls_grayscale_probe
  init_from: ""
  resume_from: ""

training:
  image_size: 512
  batch_size: 64
  epochs: 3
  lr: 0.001
  checkpoint_every: 1

input:
  input_mode: fls_grayscale
  student_mean:
  student_std:

sonar:
  sonar_mask_mode: support_hull
  sonar_mask_threshold: 3
  sonar_mask_close_kernel: 21
  sonar_mask_min_coverage: 0.05

sigreg:
  lambda_sigreg: 0.0
  sigreg_max_tokens: 2048
  sigreg_projections: 256
  sigreg_warmup_epochs: 0

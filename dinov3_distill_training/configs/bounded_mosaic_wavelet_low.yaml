run_name: bounded_mosaic_wavelet_low
description: Bounded mosaic three-channel feature distillation using raw_robust, wavelet_low, sobel_edge.

paths:
  image_dir: /path/to/bounded_mosaic_images
  weights: /path/to/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
  dinov3_repo: /path/to/dinov3
  checkpoint_dir: checkpoints_bounded_mosaic_wavelet_low
  init_from: ""
  resume_from: ""

training:
  image_size: 512
  batch_size: 32
  epochs: 1
  lr: 0.001
  checkpoint_every: 1

input:
  input_mode: sonar_features
  student_mean: [0.091898, 0.132347, 0.114527]
  student_std: [0.172297, 0.202109, 0.186716]

sonar:
  sonar_middle_channel: wavelet_low
  sonar_third_channel: sobel_edge
  sonar_occupancy_threshold: 128
  sonar_wavelet: haar
  sonar_local_contrast_blur: 31
  sonar_edge_blur: 3

sigreg:
  lambda_sigreg: 0.0
  sigreg_max_tokens: 2048
  sigreg_projections: 256
  sigreg_warmup_epochs: 0
